[package]
name = "bas-core"
description = "Profiles, credential storage, references, and the Secrets Manager client behind bas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ap-client.workspace = true
atomicwrites.workspace = true
bitwarden.workspace = true
dirs.workspace = true
keyring-core.workspace = true
serde.workspace = true
toml.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

# Cargo cannot extend `[workspace.lints]`, so this repeats them and adds `missing_docs`.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
allow_attributes = "deny"
