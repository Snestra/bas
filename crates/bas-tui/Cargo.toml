[package]
name = "bas-tui"
description = "Terminal UI for Bitwarden Secrets Manager, limited to what a machine account token can do"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arboard.workspace = true
bas-core.workspace = true
clap.workspace = true
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
ratatui = "0.30.2"
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
