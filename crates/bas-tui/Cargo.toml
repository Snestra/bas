[package]
name = "bas-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Terminal UI for Bitwarden Secrets Manager, limited to what a machine account token can do"
license = "MIT"
publish = false

[workspace]

[dependencies]
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
bitwarden = "2.1"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
ratatui = "0.30.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
allow_attributes = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
