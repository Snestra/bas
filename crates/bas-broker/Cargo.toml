[package]
name = "bas-broker"
description = "The bas credential broker: a unix socket API and an HTTPS proxy that adds credentials, for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bas-core.workspace = true
http-body-util = "0.1.5"
hudsucker = { version = "0.25.0", default-features = false, features = ["rcgen-ca", "rustls-client"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
regex = "1.13.1"
sd-notify = "0.5.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
time = "0.3.55"
tokio = { workspace = true, features = ["rt-multi-thread", "fs"] }
toml.workspace = true
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
uuid.workspace = true
zeroize.workspace = true

[lints]
workspace = true
