[package]
name = "bas-broker"
description = "The bas credential broker: a unix socket API and an HTTPS proxy that adds credentials, for Linux and macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
bas-core.workspace = true
base64 = "0.22.1"
http-body-util = "0.1.5"
hudsucker = { version = "0.25.0", default-features = false, features = ["rcgen-ca", "rustls-client"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
octocrab = { version = "0.54.9", default-features = false, features = ["default-client", "jwt-aws-lc-rs", "rustls", "rustls-ring", "timeout"] }
regex = "1.13.1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
signature = "2.2.0"
similar = "3.2.1"
ssh-agent-lib = "0.6.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "fs"] }
toml.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "registry", "std"] }
url.workspace = true
uuid.workspace = true
webauthn-rs = { version = "0.5.5", features = ["danger-credential-internals"] }
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.5.0"
tracing-journald = "0.3.2"

# webauthn-rs links OpenSSL. macOS has no system OpenSSL, and a Homebrew one lives in a
# directory the user owns, who could then run code inside the broker. Build it in.
[target.'cfg(target_os = "macos")'.dependencies]
openssl = { version = "0.10.82", features = ["vendored"] }

[lints]
workspace = true
