[workspace]
resolver = "3"
members = ["crates/bas-core", "crates/bas", "crates/bas-broker", "crates/bas-tui"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
aho-corasick = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bas-core = { path = "crates/bas-core" }
bas-tui = { path = "crates/bas-tui" }
bas-broker = { path = "crates/bas-broker" }
ap-client = { git = "https://github.com/bitwarden/agent-access", rev = "512756278c41d19314b462ca978c40d29c51bd36" }
ap-relay-client = { git = "https://github.com/bitwarden/agent-access", rev = "512756278c41d19314b462ca978c40d29c51bd36", default-features = false }
ap-relay-protocol = { git = "https://github.com/bitwarden/agent-access", rev = "512756278c41d19314b462ca978c40d29c51bd36" }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
async-trait = "0.1"
atomicwrites = "0.4.4"
bitwarden = "2.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7"
keyring-core = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "signal", "sync", "macros"] }
toml = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
rustix = { version = "1.1.6", features = ["process"] }
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
allow_attributes = "deny"
