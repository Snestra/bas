[package]
name = "bas"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Bitwarden Agent Secrets: reference-based Secrets Manager access for coding agents"
license = "MIT"
publish = false

[dependencies]
ap-client = { git = "https://github.com/bitwarden/agent-access", rev = "512756278c41d19314b462ca978c40d29c51bd36" }
ap-relay-client = { git = "https://github.com/bitwarden/agent-access", rev = "512756278c41d19314b462ca978c40d29c51bd36", default-features = false }
ap-relay-protocol = { git = "https://github.com/bitwarden/agent-access", rev = "512756278c41d19314b462ca978c40d29c51bd36" }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
async-trait = "0.1"
atomicwrites = "0.4.4"
bitwarden = "2.1"
clap = { version = "4.5", features = ["derive"] }
dirs = "7"
keyring-core = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "signal", "sync", "macros"] }
toml = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
allow_attributes = "deny"
